name: AQA Lab
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install and static checks
        run: |
          npm ci
          npm run lint
          npm run typecheck
      - name: Build and run
        run: docker compose up --build --abort-on-container-exit --exit-code-from tests
      - name: Compose logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - name: Generate Allure
        if: always()
        run: npm run report:allure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-artifacts
          path: |
            playwright-report/
            test-results/
            allure-results/
            allure-report/
            compose.log
          if-no-files-found: warn
      - name: Cleanup
        if: always()
        run: docker compose down
